<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Safety Control Rover</title>
<style>
:root{--bg1:#070b1a;--bg2:#0d1430;--glass:rgba(255,255,255,.05);--border:rgba(255,255,255,.10);--text:#eaf0ff;--muted:#8d99b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-color:var(--bg1);padding:24px 16px 40px}
.wrap{max-width:1100px;margin:auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:28px}
.title h1{font-size:26px;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.title p{color:var(--muted);font-size:13px;margin-top:4px}
.live{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--border);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:#34d399}
.dot.off{background:#f87171}.dot.demo{background:#fbbf24}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{--c:#38bdf8;padding:20px;border-radius:22px;background:var(--glass);border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:.25s}
.card:hover{transform:translateY(-5px);border-color:var(--c)}
.head{display:flex;align-items:center;gap:12px}
.ico{width:44px;height:44px;display:grid;place-items:center;font-size:22px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--border)}
.head h2{font-size:17px}
.head p{font-size:12px;color:var(--muted);margin-top:2px}
.gauge{position:relative;width:150px;height:150px;margin:18px auto 8px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge circle{fill:none;stroke-width:9;stroke-linecap:round}
.gauge .bg{stroke:rgba(255,255,255,.08)}
.gauge .fg{stroke:var(--c);stroke-dasharray:326.73;stroke-dashoffset:326.73;transition:stroke-dashoffset .9s ease}
.gv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gv b{font-size:34px}
.gv small{margin-top:5px;font-size:13px;color:var(--muted)}
.badge{display:block;width:fit-content;margin:4px auto 14px;padding:5px 16px;border-radius:999px;font-size:12px;font-weight:700;color:var(--c);background:rgba(255,255,255,.06);border:1px solid var(--c)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.foot span{font-size:12px;color:var(--muted);white-space:nowrap}
.spark{flex:1;height:32px;min-width:0}
.spark polyline{fill:none;stroke:var(--c);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
footer{margin-top:32px;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="title">
    <h1>Mini Safety Control Rover</h1>
    <p>MQ-135, MQ-6, soil moisture and climate sensors</p>
  </div>
  <div class="live"><div class="dot" id="dot"></div><span id="status">Connecting...</span></div>
</header>
<div class="grid" id="grid"></div>
<footer id="foot">Auto refresh every 2 seconds</footer>
</div>

<script>
const CIRC=2*Math.PI*52,MAX_POINTS=30;
const GREEN="#34d399",AMBER="#fbbf24",RED="#f87171",BLUE="#38bdf8";
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const gasStatus=v=>v<30?["Safe",GREEN]:v<60?["Moderate",AMBER]:["High",RED];

const cfg=[
{id:"mq135",name:"MQ-135",sub:"Air quality / smoke gas sensor",icon:"💨",unit:"%",val:d=>d.mq135,raw:d=>"Raw: "+d.mq135raw,pct:v=>v,status:gasStatus},
{id:"mq6",name:"MQ-6",sub:"LPG / butane gas sensor",icon:"🔥",unit:"%",val:d=>d.mq6,raw:d=>"Raw: "+d.mq6raw,pct:v=>v,status:gasStatus},
{id:"soil",name:"Soil Moisture",sub:"Ground wetness level",icon:"🌱",unit:"%",val:d=>d.soil,raw:d=>"Raw: "+d.soilraw,pct:v=>v,status:v=>v<30?["Dry",AMBER]:v<70?["Good",GREEN]:["Wet",BLUE]},
{id:"temp",name:"Temperature",sub:"DHT11 ambient",icon:"🌡️",unit:"°C",val:d=>d.temperature,raw:()=>"Range 0-50 °C",pct:v=>clamp(v/50*100,0,100),status:v=>v<18?["Cool",BLUE]:v<=32?["Normal",GREEN]:v<=38?["Warm",AMBER]:["Hot",RED]},
{id:"hum",name:"Humidity",sub:"DHT11 air moisture",icon:"💧",unit:"%",val:d=>d.humidity,raw:()=>"Relative humidity",pct:v=>clamp(v,0,100),status:v=>v<30?["Dry",AMBER]:v<=60?["Comfortable",GREEN]:["Humid",BLUE]}
];

const hist={},grid=document.getElementById("grid");
cfg.forEach(c=>{
  hist[c.id]=[];
  const card=document.createElement("div");
  card.className="card";card.id="card-"+c.id;
  card.innerHTML=`<div class="head"><div class="ico">${c.icon}</div><div><h2>${c.name}</h2><p>${c.sub}</p></div></div>
  <div class="gauge"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"></circle><circle class="fg" id="ring-${c.id}" cx="60" cy="60" r="52"></circle></svg>
  <div class="gv"><b id="v-${c.id}">--</b><small>${c.unit}</small></div></div>
  <div class="badge" id="b-${c.id}">--</div>
  <div class="foot"><span id="r-${c.id}">--</span><svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline id="s-${c.id}" points=""></polyline></svg></div>`;
  grid.appendChild(card);
});

function render(c,d){
  const value=parseFloat(c.val(d));
  if(isNaN(value))return;
  const p=clamp(c.pct(value),0,100),st=c.status(value);
  document.getElementById("card-"+c.id).style.setProperty("--c",st[1]);
  document.getElementById("v-"+c.id).textContent=value;
  document.getElementById("r-"+c.id).textContent=c.raw(d);
  document.getElementById("b-"+c.id).textContent=st[0];
  document.getElementById("ring-"+c.id).style.strokeDashoffset=CIRC*(1-p/100);
  const h=hist[c.id];h.push(p);if(h.length>MAX_POINTS)h.shift();
  const pts=h.map((val,i)=>(h.length===1?100:i/(MAX_POINTS-1)*100).toFixed(1)+","+(28-(val/100)*26).toFixed(1)).join(" ");
  document.getElementById("s-"+c.id).setAttribute("points",pts);
}

function setStatus(mode){
  const dot=document.getElementById("dot"),txt=document.getElementById("status");
  dot.className="dot";
  const t=new Date().toLocaleTimeString();
  txt.textContent="Live • "+t;
  document.getElementById("foot").textContent="Auto refresh every 2 seconds";
}

/* Simulated readings used when no ESP32 is reachable */
let t0=0;
function demo(){
  t0+=1;
  const w=(a,b,s,o=0)=>a+(b-a)*(0.5+0.5*Math.sin(t0/s+o));
  const m135=Math.round(w(12,48,9)),m6=Math.round(w(8,40,13,2));
  return{mq135:m135,mq135raw:Math.round(m135*40.95),mq6:m6,mq6raw:Math.round(m6*40.95),
    soil:Math.round(w(0,4,17,1)),soilraw:Math.round(w(0,4,17,1)*40.95),
    temperature:+w(24.5,26,21).toFixed(1),humidity:Math.round(w(45,65,15,3))};
}

function updateData(){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),1500);
  fetch("/data",{signal:ctl.signal})
    .then(r=>{if(!r.ok)throw 0;return r.json()})
    .then(d=>{if(typeof d!=="object"||d===null||d.mq135===undefined)throw 0;cfg.forEach(c=>render(c,d));setStatus("live")})
    .catch(()=>{const d=demo();cfg.forEach(c=>render(c,d));setStatus("demo")})
    .finally(()=>clearTimeout(to));
}
updateData();
setInterval(updateData,2000);
</script>
</body>
</html>
